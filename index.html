<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satary_SokaInside - Live Scores & News</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #161b22;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #2ea44f;
        }
        h1 {
            color: #2ea44f;
            margin: 0;
            font-size: 28px;
        }
        p {
            color: #8b949e;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .match {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .live-tag {
            background-color: #da3633;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Satary_SokaInside ⚽</h1>
        <p>Matokeo Mubashara, Ratiba & Habari za Soka</p>
    </header>

    <div class="container">
        <div class="card">
            <span class="live-tag">LIVE 75'</span>
            <div class="match">
                <span>Arsenal 🔴</span>
                <span>2 - 1</span>
                <span>Chelsea 🔵</span>
            </div>
        </div>

        <div class="card">
            <h3>Habari Mpya za Soka 📰</h3>
            <p>Karibu kwenye mfumo rasmi wa Satary_SokaInside. Tujiandae kwa msimu mpya wa soka!</p>
        </div>
    </div>

</body>
</html>
